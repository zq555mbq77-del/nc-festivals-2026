<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NC Festivals 2026</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1a2e; --paper: #faf8f5; --accent: #c0392b; --accent-light: #e74c3c;
  --sage: #5b7553; --sage-light: #8fad85; --warm-gray: #a09890;
  --light-line: #e8e2da; --card-bg: #ffffff;
  --shadow: 0 2px 20px rgba(26,26,46,0.08); --radius: 10px;
  --header-h: 0px; --controls-h: 0px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:"DM Sans",sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;min-height:100vh;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* ── Header ── */
header{background:var(--ink);color:var(--paper);padding:1.2rem 1.5rem 1rem;position:relative;overflow:hidden}
header::before{content:'';position:absolute;top:-50%;right:-10%;width:400px;height:400px;
  background:radial-gradient(circle,rgba(192,57,43,.15) 0%,transparent 70%);pointer-events:none}
.header-inner{max-width:1400px;margin:0 auto;position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px}
.header-text h1{font-family:"DM Serif Display",serif;font-size:clamp(1.3rem,3vw,2rem);font-weight:400;line-height:1.2;letter-spacing:-.02em}
h1 span{color:var(--accent-light)}
.header-sub{color:var(--warm-gray);font-size:0.78rem;margin-top:2px}
.header-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);border-radius:100px;padding:3px 10px;
  font-size:0.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-light);margin-bottom:6px}
.header-badge .dot{width:5px;height:5px;background:var(--sage-light);border-radius:50%;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.header-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.suggest-link{color:var(--sage-light);font-size:.7rem;font-weight:600;text-decoration:none;
  border:1px solid rgba(143,173,133,.3);border-radius:100px;padding:4px 10px;white-space:nowrap;
  transition:all .2s}
.suggest-link:hover{background:rgba(143,173,133,.15);border-color:var(--sage-light)}
.festival-count-badge{color:rgba(255,255,255,.4);font-size:.68rem}

/* ── Controls ── */
.controls{max-width:100%;padding:.8rem 1rem;display:flex;flex-direction:column;gap:8px;
  position:sticky;top:0;z-index:900;background:var(--paper);border-bottom:1px solid var(--light-line)}
@supports(-webkit-touch-callout:none){
  .controls{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);background:rgba(250,248,245,.94)}
}
.controls-row1{display:flex;gap:8px;align-items:center}
.search-box{flex:1;position:relative}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--warm-gray)}
.search-box input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--light-line);border-radius:var(--radius);
  font-family:inherit;font-size:16px;background:var(--card-bg);color:var(--ink);transition:border-color .2s}
.search-box input:focus{outline:none;border-color:var(--sage)}
.search-box input::placeholder{color:var(--warm-gray)}

.controls-row2{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding-bottom:2px}
.controls-row2::-webkit-scrollbar{display:none}
.controls-row3{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding-bottom:2px;align-items:center}
.controls-row3::-webkit-scrollbar{display:none}

.filter-btn{padding:7px 14px;border:1.5px solid var(--light-line);border-radius:100px;
  background:var(--card-bg);font-family:inherit;font-size:.74rem;font-weight:600;
  color:var(--ink);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;min-height:34px}
.filter-btn:hover{border-color:var(--sage);color:var(--sage)}
.filter-btn.active{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filter-btn.active:hover{background:#252542}
.filter-btn .count{font-size:.62rem;opacity:.7;margin-left:2px}

.quick-btn{padding:7px 12px;border:1.5px solid var(--light-line);border-radius:100px;
  background:var(--card-bg);font-family:inherit;font-size:.74rem;font-weight:600;
  color:var(--ink);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;min-height:34px}
.quick-btn:hover{border-color:var(--accent);color:var(--accent)}
.quick-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

.near-me-btn{padding:7px 12px;border:1.5px solid var(--light-line);border-radius:100px;
  background:var(--card-bg);font-family:inherit;font-size:.74rem;font-weight:600;
  color:var(--ink);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;
  display:flex;align-items:center;gap:5px;min-height:34px}
.near-me-btn.active{background:#1565c0;border-color:#1565c0;color:#fff}
.near-me-btn svg{width:13px;height:13px;flex-shrink:0}

.clear-btn{padding:7px 12px;border:1.5px solid var(--accent-light);border-radius:100px;
  background:transparent;font-family:inherit;font-size:.74rem;font-weight:600;
  color:var(--accent);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;min-height:34px}
.clear-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

.result-count{font-size:.72rem;color:var(--warm-gray);font-weight:500;white-space:nowrap;margin-left:auto;flex-shrink:0}
.hide-past-btn{padding:6px 10px;border:1.5px solid var(--light-line);border-radius:100px;
  background:var(--card-bg);font-family:inherit;font-size:.72rem;font-weight:600;
  color:var(--warm-gray);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.hide-past-btn.active{background:var(--sage);border-color:var(--sage);color:#fff}

/* ── Main Layout ── */
.main-layout{max-width:100%;padding:0;display:flex;flex-direction:column;gap:0;box-sizing:border-box}
@media(min-width:1001px){
  .main-layout{flex-direction:row;padding:1.2rem 1.5rem;gap:0;align-items:start;min-height:calc(100vh - 160px)}
}

/* ── Table Panel ── */
.table-panel{background:var(--card-bg);overflow:hidden;border:1px solid var(--light-line);
  box-shadow:var(--shadow);flex:1 1 0;min-width:280px}
@media(min-width:1001px){.table-panel{border-radius:var(--radius)}}
.table-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@media(max-width:1000px){.table-scroll{max-height:55vh}}
@media(min-width:1001px){.table-scroll{max-height:calc(100vh - 200px)}}
.table-scroll::-webkit-scrollbar{width:5px}
.table-scroll::-webkit-scrollbar-thumb{background:var(--light-line);border-radius:3px}

table{width:100%;border-collapse:collapse;table-layout:fixed}
thead{position:sticky;top:0;z-index:10}
thead th{background:var(--ink);color:var(--paper);padding:10px 12px;text-align:left;
  font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;user-select:none;transition:background .15s;white-space:nowrap}
thead th:hover{background:#252542}
thead th .sort-arrow{margin-left:3px;opacity:.5;font-size:.6rem}
thead th.sorted .sort-arrow{opacity:1;color:var(--accent-light)}
tr.filter-row td{background:#f3f0eb;padding:5px 6px;border-bottom:2px solid var(--light-line)}
.col-filter{width:100%;font-family:inherit;font-size:.73rem;color:var(--ink);
  background:var(--card-bg);border:1.5px solid var(--light-line);
  border-radius:6px;padding:5px 6px;outline:none;transition:border-color .2s}
.col-filter:focus{border-color:var(--sage)}
select.col-filter{cursor:pointer}

tbody tr{border-bottom:1px solid var(--light-line);cursor:pointer;transition:background .15s}
tbody tr:hover{background:#f5f2ee}
tbody tr.selected{background:#eef3ec}
tbody tr.today-row{background:#fff8e8;border-left:3px solid #e67e22}
tbody tr.past-fest{opacity:.45}
tbody tr.past-fest .fest-name{text-decoration:line-through;text-decoration-color:rgba(160,152,144,.5)}
td{padding:10px 12px;font-size:.83rem;vertical-align:top}

.fest-name{font-weight:600;color:var(--ink);margin-bottom:2px;word-wrap:break-word}
.fest-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:3px}
.fest-desc{color:var(--warm-gray);font-size:.76rem;line-height:1.45;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  transition:all .2s}
.fest-desc.expanded{display:block;-webkit-line-clamp:unset}
.expand-btn{font-size:.68rem;color:var(--sage);cursor:pointer;font-weight:600;
  background:none;border:none;font-family:inherit;padding:2px 0;display:block;margin-top:2px}
.fest-loc-inline{display:none}
.fest-date{white-space:nowrap;font-weight:500;font-size:.8rem}
.fest-date .month{color:var(--accent);font-weight:700;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em}
.fest-location{font-size:.8rem}
.past-label{font-size:.6rem;font-weight:700;color:var(--warm-gray);
  background:#f0ece6;border-radius:100px;padding:1px 7px;letter-spacing:.04em}

.theme-tag{display:inline-block;padding:3px 9px;border-radius:100px;
  font-size:.65rem;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.theme-music{background:#fce4ec;color:#c0392b}
.theme-food{background:#fff3e0;color:#e67e22}
.theme-cultural{background:#e8eaf6;color:#3f51b5}
.theme-arts{background:#f3e5f5;color:#8e24aa}
.theme-seasonal{background:#e0f2f1;color:#00796b}
.theme-heritage{background:#efebe9;color:#5d4037}
.theme-nature{background:#e8f5e9;color:#2e7d32}
.theme-sports{background:#e3f2fd;color:#1565c0}

.train-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:100px;
  font-size:.62rem;font-weight:600;background:#e8f5e9;color:#2e7d32;white-space:nowrap;
  letter-spacing:.02em;cursor:pointer;position:relative}
.train-badge svg{width:11px;height:11px;flex-shrink:0}

/* Row action buttons */
.row-actions{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.fav-btn,.cal-btn,.fest-link{display:inline-flex;align-items:center;gap:3px;
  padding:3px 9px;border-radius:100px;font-size:.65rem;font-weight:600;
  border:1.5px solid var(--light-line);background:var(--card-bg);
  cursor:pointer;font-family:inherit;transition:all .2s;text-decoration:none;color:var(--ink)}
.fav-btn:hover{border-color:#e91e63;color:#e91e63}
.fav-btn.active{background:#fce4ec;border-color:#e91e63;color:#e91e63}
.fav-btn svg{width:12px;height:12px}
.cal-btn:hover{border-color:var(--sage);color:var(--sage)}
.cal-btn svg{width:12px;height:12px}
.fest-link:hover{border-color:var(--sage);color:var(--sage)}
.fest-link svg{width:11px;height:11px}
.dist-badge{font-size:.62rem;color:var(--warm-gray);font-weight:500;
  padding:3px 8px;border-radius:100px;background:#f0ece6;white-space:nowrap}

.no-results{padding:3rem 2rem;text-align:center;color:var(--warm-gray)}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
tbody tr{animation:fadeIn .25s ease-out both}

/* ── Resizer (desktop only) ── */
.panel-resizer{flex:0 0 14px;width:14px;cursor:col-resize;display:none;
  align-items:stretch;justify-content:center;margin:0 2px;position:relative;z-index:10;
  user-select:none;-webkit-user-select:none;border-radius:6px;transition:background .2s}
@media(min-width:1001px){.panel-resizer{display:flex}}
.panel-resizer:hover,.panel-resizer.dragging{background:rgba(91,117,83,.08)}
.panel-resizer::before{content:'';width:4px;background:var(--light-line);
  border-radius:4px;transition:background .2s,width .15s;margin:12px 0}
.panel-resizer:hover::before,.panel-resizer.dragging::before{background:var(--sage);width:5px}
.panel-resizer::after{content:'⋮⋮';position:absolute;top:50%;transform:translateY(-50%);
  font-size:12px;color:var(--warm-gray);letter-spacing:-2px;pointer-events:none;transition:color .2s}
.panel-resizer:hover::after,.panel-resizer.dragging::after{color:var(--sage)}

/* ── Map Panel ── */
.map-panel{background:var(--card-bg);border:1px solid var(--light-line);box-shadow:var(--shadow);
  flex:0 0 420px;width:420px;min-width:200px}
@media(min-width:1001px){.map-panel{border-radius:var(--radius);position:sticky;top:72px;align-self:start}}
@media(max-width:1000px){.map-panel{width:100%!important;flex:none}}

.map-toggle-bar{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--light-line);cursor:pointer;
  background:var(--card-bg)}
@media(min-width:1001px){.map-toggle-bar{cursor:default}}
.map-toggle-bar .mtb-left{display:flex;align-items:center;gap:8px;
  font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--warm-gray)}
.live-dot{width:7px;height:7px;background:var(--sage);border-radius:50%}
.map-chevron{font-size:1rem;color:var(--warm-gray);transition:transform .2s;line-height:1}
.map-body{display:none}
@media(min-width:1001px){.map-body{display:block!important}}
.map-body.open{display:block}

.map-container{position:relative;width:100%;height:320px;background:#faf8f5;overflow:hidden}
@media(min-width:1001px){.map-container{height:calc(100vh - 360px);min-height:340px;max-height:600px}}
.map-svg{position:absolute;top:0;left:0;width:100%;height:100%;cursor:grab}
.map-tooltip{position:absolute;background:var(--card-bg);border-radius:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.18);padding:9px 12px;pointer-events:none;
  z-index:100;min-width:130px;max-width:200px;opacity:0;transform:translateY(4px);
  transition:opacity .2s,transform .2s;word-wrap:break-word}
.map-tooltip.visible{opacity:1;transform:translateY(0)}
.map-tooltip .tt-name{font-weight:700;font-size:.82rem;margin-bottom:2px}
.map-tooltip .tt-date{font-size:.74rem;color:var(--accent);font-weight:600;margin-bottom:2px}
.map-tooltip .tt-loc{font-size:.72rem;color:var(--warm-gray)}

.map-legend{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.92);
  border-radius:7px;padding:7px 10px;font-size:.62rem;display:flex;flex-wrap:wrap;
  gap:5px;box-shadow:0 1px 8px rgba(0,0,0,.08);z-index:50;max-width:220px}
.legend-item{display:flex;align-items:center;gap:3px;cursor:pointer;padding:1px 4px;
  border-radius:4px;transition:background .15s;font-weight:500}
.legend-item:hover{background:rgba(0,0,0,.06)}
.legend-item.active-filter{background:rgba(0,0,0,.1);font-weight:700}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.zoom-controls{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:3px;z-index:60}
.zoom-btn{width:28px;height:28px;background:var(--card-bg);border:1.5px solid var(--light-line);
  border-radius:7px;font-size:.95rem;font-weight:700;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.1);
  transition:all .15s;line-height:1;padding:0}
.zoom-btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.selected-card{padding:12px 14px;border-top:1px solid var(--light-line);
  background:#f9f7f4;display:none}
.selected-card.visible{display:block}
.sc-name{font-weight:700;font-size:.86rem;margin-bottom:2px}
.sc-meta{font-size:.76rem;color:var(--accent);font-weight:600;margin-bottom:4px}
.sc-desc{font-size:.75rem;color:var(--warm-gray);line-height:1.5;margin-bottom:6px}
.sc-actions{display:flex;gap:6px;flex-wrap:wrap}

.map-info{padding:8px 14px;border-top:1px solid var(--light-line);
  font-size:.72rem;color:var(--warm-gray);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.map-dot{cursor:pointer}
.map-dot:hover{filter:brightness(.85)}

/* ── Amtrak Tooltip ── */
.amtrak-tooltip{position:fixed;z-index:9999;background:var(--ink);color:var(--paper);
  border-radius:10px;padding:11px 13px;box-shadow:0 6px 24px rgba(0,0,0,.22);
  min-width:230px;max-width:290px;pointer-events:none;
  opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;font-family:"DM Sans",sans-serif}
.amtrak-tooltip.visible{opacity:1;transform:translateY(0)}
.at-header{display:flex;align-items:center;gap:7px;margin-bottom:7px;padding-bottom:7px;
  border-bottom:1px solid rgba(255,255,255,.12)}
.at-station{font-weight:700;font-size:.83rem;line-height:1.3}
.at-time{font-size:.76rem;color:#a8d5a2;font-weight:600;margin-bottom:5px}
.at-routes{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.at-route{font-size:.64rem;font-weight:700;padding:2px 8px;border-radius:100px;letter-spacing:.03em}
.at-route.carolinian{background:#1565c0;color:#fff}
.at-route.piedmont{background:#c0392b;color:#fff}
.at-route.silver-star{background:#6a1b9a;color:#fff}
.at-route.crescent{background:#e65100;color:#fff}
.at-route.palmetto{background:#00695c;color:#fff}
.at-walk{font-size:.73rem;color:#a8d5a2;line-height:1.4;margin-bottom:5px;
  padding:5px 8px;background:rgba(255,255,255,.06);border-radius:6px}
.at-note{font-size:.7rem;color:rgba(255,255,255,.6);line-height:1.4}

/* ── Favorites View ── */
.favs-panel{display:none;padding:12px;background:#fff9f0;border-bottom:2px solid #f0e0c0}
.favs-panel.visible{display:block}
.favs-panel h3{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--warm-gray);margin-bottom:8px}
.fav-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;
  background:var(--card-bg);border:1.5px solid #e91e63;border-radius:100px;
  font-size:.72rem;font-weight:600;color:var(--ink);margin:2px;cursor:pointer}
.fav-chip .remove{color:#e91e63;font-size:.8rem;line-height:1}
.empty-favs{font-size:.76rem;color:var(--warm-gray);font-style:italic}

/* ── Share Toast ── */
.share-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:9px 18px;border-radius:100px;
  font-size:.78rem;font-weight:600;opacity:0;transition:all .3s;z-index:9999;white-space:nowrap;pointer-events:none}
.share-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Mobile ── */
@media(max-width:600px){
  header{padding:1rem 1rem .8rem;
    padding-left:max(1rem,env(safe-area-inset-left));
    padding-right:max(1rem,env(safe-area-inset-right))}
  .header-inner{flex-wrap:wrap}
  .header-actions{flex-direction:row;align-items:center}
  .controls{padding:.65rem .9rem;
    padding-left:max(.9rem,env(safe-area-inset-left));
    padding-right:max(.9rem,env(safe-area-inset-right))}
  .main-layout{padding:0;
    padding-bottom:max(1rem,env(safe-area-inset-bottom))}
  td{padding:9px 10px}
  thead th{padding:8px 10px;font-size:.62rem}
  .fest-name{font-size:.8rem}
  .fest-desc{font-size:.72rem;-webkit-line-clamp:1}
  .fest-date{font-size:.74rem}
  .theme-tag{font-size:.6rem;padding:2px 7px}
  .train-badge{font-size:.58rem;padding:1px 6px}
  .row-actions{gap:4px}
  .fav-btn,.cal-btn,.fest-link{font-size:.6rem;padding:2px 7px}
  th[data-col="location"],td.fest-location{display:none}
  .fest-loc-inline{display:flex;align-items:center;gap:4px;flex-wrap:wrap;
    font-size:.7rem;color:var(--warm-gray);margin-top:1px}
  th[data-col="date"],td:first-child{width:66px}
  th[data-col="theme"],td:last-child{width:64px}
  tr.filter-row{display:none}
}
@media(max-width:375px){
  .fest-desc{display:none}
  .row-actions{display:none}
  header{padding:.9rem .75rem .7rem}
}
@media(orientation:landscape) and (max-height:500px){
  .map-container{height:200px}
  .table-scroll{max-height:45vh}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-text">
      <div class="header-badge"><span class="dot"></span> Live Directory</div>
      <h1>NC <span>Festivals</span> 2026</h1>

let colFilterMonth="",colFilterName="",colFilterLocation="",colFilterTheme="";
let quickFilter="",hidePast=false,regionFilter="all";
let userLat=null,userLng=null,nearMe=false;
let favorites=new Set(JSON.parse(localStorage.getItem("ncfavs")||"[]"));
function saveFavs(){localStorage.setItem("ncfavs",JSON.stringify([...favorites]))}

/* ── URL State ── */
function readURL(){
  const p=new URLSearchParams(location.search);
  if(p.get("theme"))activeTheme=p.get("theme");
  if(p.get("q"))searchTerm=p.get("q");
  if(p.get("region"))regionFilter=p.get("region");
  if(p.get("month"))colFilterMonth=p.get("month");
}
function writeURL(){
  const p=new URLSearchParams();
  if(activeTheme!=="all")p.set("theme",activeTheme);
  if(searchTerm)p.set("q",searchTerm);
  if(regionFilter!=="all")p.set("region",regionFilter);
  if(colFilterMonth)p.set("month",colFilterMonth);
  const url=location.pathname+(p.toString()?"?"+p.toString():"");
  history.replaceState(null,"",url);
}
function shareApp(){
  writeURL();
  if(navigator.share){navigator.share({title:"NC Festivals 2026",url:location.href})}
  else if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(()=>showToast())}
}
function showToast(){const t=document.getElementById("shareToast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500)}

/* ── Regions ── */
const regions={mountains:{lngMax:-81.5},piedmont:{lngMin:-81.5,lngMax:-78.5},coast:{lngMin:-78.5}};
const regionLabels={all:"📍 All Regions",mountains:"⛰ Mountains",piedmont:"🏙 Piedmont",coast:"🌊 Coast"};
const regionOrder=["all","mountains","piedmont","coast"];
function cycleRegion(){
  const i=regionOrder.indexOf(regionFilter);
  regionFilter=regionOrder[(i+1)%regionOrder.length];
  document.getElementById("regionBtn").textContent=regionLabels[regionFilter];
  document.getElementById("regionBtn").classList.toggle("active",regionFilter!=="all");
  render();writeURL();
}
function inRegion(f){
  if(regionFilter==="all")return true;
  if(regionFilter==="mountains")return f.lng<=-81.5;
  if(regionFilter==="piedmont")return f.lng>-81.5&&f.lng<=-78.5;
  if(regionFilter==="coast")return f.lng>-78.5;
  return true;
}

/* ── Quick Filters ── */
function setQuick(q){
  quickFilter=quickFilter===q?"":q;
  ["qWeekend","qMonth","qFavs"].forEach(id=>document.getElementById(id).classList.remove("active"));
  if(quickFilter==="weekend")document.getElementById("qWeekend").classList.add("active");
  if(quickFilter==="month")document.getElementById("qMonth").classList.add("active");
  if(quickFilter==="favs")document.getElementById("qFavs").classList.add("active");
  render();
}
function getWeekendRange(){
  const d=new Date(TODAY);
  const day=d.getDay();
  const sat=new Date(d);sat.setDate(d.getDate()+(day<=6?6-day:6));sat.setHours(0,0,0,0);
  const sun=new Date(sat);sun.setDate(sat.getDate()+1);sun.setHours(23,59,59,999);
  if(day===0){sat.setDate(d.getDate());sun.setDate(d.getDate());}
  return{start:sat,end:sun};
}
function inThisWeekend(f){
  const{start,end}=getWeekendRange();
  const fStart=pd(f.date);
  const fEnd=f.endDate?new Date(f.date.substring(0,4)+"-"+String(MN.indexOf(f.endDate.split(" ")[0])+1).padStart(2,"0")+"-"+f.endDate.split(" ")[1].replace(/\D/g,"").padStart(2,"0")+"T23:59:59"):new Date(f.date+"T23:59:59");
  return fStart<=end&&fEnd>=start;
}
function inThisMonth(f){const d=pd(f.date);return d.getMonth()===TODAY.getMonth()&&d.getFullYear()===TODAY.getFullYear()}

/* ── Hide Past ── */
function toggleHidePast(){hidePast=!hidePast;document.getElementById("hidePastBtn").classList.toggle("active",hidePast);render()}

/* ── Near Me ── */
function toggleNearMe(){
  const btn=document.getElementById("nearMeBtn");
  // If already active, turn off
  if(nearMe){
    nearMe=false;userLat=null;userLng=null;
    btn.classList.remove("active");
    btn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>Near Me`;
    render();return;
  }
  // Check support
  if(!navigator.geolocation){
    nearMeFallback();return;
  }
  // Show loading state
  btn.innerHTML=`⏳ Locating…`;
  btn.classList.add("active");
  navigator.geolocation.getCurrentPosition(
    pos=>{
      userLat=pos.coords.latitude;
      userLng=pos.coords.longitude;
      nearMe=true;
      btn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>Near Me`;
      render();
    },
    err=>{
      btn.classList.remove("active");
      btn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>Near Me`;
      nearMeFallback();
    },
    {timeout:8000,enableHighAccuracy:false}
  );
}
function nearMeFallback(){
  const city=prompt("📍 Enter your city or zip code in NC (e.g. Raleigh, Asheville, 27601):");
  if(!city)return;
  // Simple NC city lookup
  const cities={
    "raleigh":[35.7796,-78.6382],"cary":[35.7913,-78.7811],"durham":[35.994,-78.8986],
    "chapel hill":[35.9132,-79.0558],"charlotte":[35.2271,-80.8431],"greensboro":[36.0726,-79.792],
    "winston-salem":[36.0999,-80.2442],"winston salem":[36.0999,-80.2442],
    "asheville":[35.5951,-82.5515],"wilmington":[34.2257,-77.9447],
    "fayetteville":[35.0527,-78.8784],"high point":[35.9557,-80.0053],
    "concord":[35.4088,-80.5795],"apex":[35.7327,-78.8503],
    "holly springs":[35.6513,-78.8336],"morrisville":[35.8245,-78.8258],
    "wake forest":[35.9799,-78.5097],"garner":[35.7068,-78.6144],
    "huntersville":[35.4106,-80.8429],"matthews":[35.1168,-80.7237],
    "boone":[36.2168,-81.6746],"hickory":[35.7343,-81.3412],
    "salisbury":[35.671,-80.4742],"burlington":[36.0957,-79.4378],
    "rocky mount":[35.938,-77.7905],"wilson":[35.7213,-77.9153],
    "hendersonville":[35.3187,-82.4612],"kannapolis":[35.4919,-80.6212],
    "goldsboro":[35.385,-77.992],"jacksonville":[34.7540,-77.4302],
    "mooresville":[35.5846,-80.8098],"sanford":[35.48,-79.179],
    "pinehurst":[35.1954,-79.4692],"southern pines":[35.1732,-79.3920],
    "outer banks":[35.9,-75.68],"obx":[35.9,-75.68],
    "kill devil hills":[36.0307,-75.6549],"nags head":[35.9582,-75.6249],
    "beaufort":[34.7182,-76.6638],"morehead city":[34.7229,-76.726],
    "new bern":[35.1085,-77.0441],"kinston":[35.2626,-77.5816],
    "elizabeth city":[36.3015,-76.2513],"edenton":[36.0582,-76.6071],
  };
  const key=city.toLowerCase().trim();
  let coords=null;
  // Check city name
  for(const [k,v] of Object.entries(cities)){
    if(key.includes(k)||k.includes(key)){coords=v;break;}
  }
  if(coords){
    userLat=coords[0];userLng=coords[1];nearMe=true;
    const btn=document.getElementById("nearMeBtn");
    btn.classList.add("active");
    btn.innerHTML=`📍 ${city.trim()}`;
    render();
  } else {
    // Try geocoding via a public API
    fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city+", North Carolina")}&format=json&limit=1`)
      .then(r=>r.json())
      .then(data=>{
        if(data&&data[0]){
          userLat=parseFloat(data[0].lat);
          userLng=parseFloat(data[0].lon);
          nearMe=true;
          const btn=document.getElementById("nearMeBtn");
          btn.classList.add("active");
          btn.innerHTML=`📍 ${city.trim()}`;
          render();
        } else {
          alert(`Couldn't find "${city}" in NC. Try a city name like Raleigh, Asheville, or Wilmington.`);
        }
      })
      .catch(()=>alert("Location lookup failed. Try a major city name like Raleigh or Charlotte."));
  }
}
function distKm(f){if(!userLat)return 9999;const R=6371,dLat=(f.lat-userLat)*Math.PI/180,dLng=(f.lng-userLng)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(userLat*Math.PI/180)*Math.cos(f.lat*Math.PI/180)*Math.sin(dLng/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function fmtDist(km){const mi=km*0.621371;return mi<0.3?"Right here":mi<1?"<1 mi away":Math.round(mi)+" mi away"}

function toggleFav(name,e){
  e.stopPropagation();

function renderFavsPanel(){

  panel.classList.add("visible");

}

/* ── Add to Calendar ── */
function addToCalendar(f,e){
  e.stopPropagation();

  // Build start date (YYYYMMDD)
  const startStr=f.date.replace(/-/g,"");

  // Build end date — iCal end is exclusive (day after last day)
  let endStr=startStr;
  if(f.endDate){
    const parts=f.endDate.match(/(\w+)\s+(\d+)/);
    if(parts){
      const m=String(MN.indexOf(parts[1])+1).padStart(2,"0");
      const d=parts[2].padStart(2,"0");
      endStr=f.date.substring(0,4)+m+d;
    }
  }
  // Add one day for iCal exclusive end
  const endDate=new Date(endStr.substring(0,4)+"-"+endStr.substring(4,6)+"-"+endStr.substring(6,8)+"T00:00:00");
  endDate.setDate(endDate.getDate()+1);
  const endExclusive=endDate.toISOString().substring(0,10).replace(/-/g,"");

  // Escape text for iCal (commas, semicolons, backslashes, newlines)
  function esc(s){return(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}

  // Fold long lines per RFC 5545 (max 75 octets)
  function fold(line){
    const out=[];
    while(line.length>75){out.push(line.substring(0,75));line=" "+line.substring(75);}
    out.push(line);
    return out.join("\r\n");
  }

  // Unique ID
  const uid=f.name.replace(/\W+/g,"-").toLowerCase()+"-"+startStr+"@ncfestivals2026";

  // Build iCal content
  const lines=[
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//NC Festivals 2026//EN",
    "CALSCALE:GREGORIAN",
    "METHOD:PUBLISH",
    "BEGIN:VEVENT",
    fold("UID:"+uid),
    fold("SUMMARY:"+esc(f.name)+" — "+esc(f.location)+", NC"),
    "DTSTART;VALUE=DATE:"+startStr,
    "DTEND;VALUE=DATE:"+endExclusive,
    fold("DESCRIPTION:"+esc(f.desc)+(f.url?"\\n\\n"+esc(f.url):"")),
    fold("LOCATION:"+esc(f.location)+", North Carolina"),
    f.url?fold("URL:"+f.url):"",
    "STATUS:CONFIRMED",
    "TRANSP:TRANSPARENT",
    "END:VEVENT",
    "END:VCALENDAR"
  ].filter(Boolean).join("\r\n");

  // Download .ics file
  const blob=new Blob([lines],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=f.name.replace(/[^a-z0-9]/gi,"-").toLowerCase()+".ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ── Theme Counts ── */
function updateCounts(){
  const base=[...festivals].filter(f=>!isPast(f));
  const themes=["Music","Food & Drink","Cultural","Arts","Heritage","Nature","Seasonal","Sports"];
  document.getElementById("cnt-all").textContent=base.length;
  themes.forEach(t=>{
    const id="cnt-"+t.replace(/ & /,"");
    const el=document.getElementById(id);
    if(el)el.textContent=base.filter(f=>f.theme===t).length;
  });
}

/* ── Get Filtered ── */
function getFiltered(){
  let d=[...festivals];
  if(hidePast)d=d.filter(f=>!isPast(f));
  if(activeTheme!=="all")d=d.filter(f=>f.theme===activeTheme);
  if(regionFilter!=="all")d=d.filter(f=>inRegion(f));
  if(quickFilter==="weekend")d=d.filter(f=>inThisWeekend(f));
  if(quickFilter==="month")d=d.filter(f=>inThisMonth(f));
  if(quickFilter==="favs")d=d.filter(f=>favorites.has(f.name));
  if(searchTerm){const q=searchTerm.toLowerCase();d=d.filter(f=>f.name.toLowerCase().includes(q)||f.location.toLowerCase().includes(q)||f.theme.toLowerCase().includes(q)||(f.desc&&f.desc.toLowerCase().includes(q)))}
  if(colFilterMonth){d=d.filter(f=>{const m=MN[pd(f.date).getMonth()];return m===colFilterMonth||(f.endDate&&f.endDate.startsWith(colFilterMonth))})}
  if(colFilterName){const q=colFilterName.toLowerCase();d=d.filter(f=>f.name.toLowerCase().includes(q))}
  if(colFilterLocation){const q=colFilterLocation.toLowerCase();d=d.filter(f=>f.location.toLowerCase().includes(q))}
  if(colFilterTheme)d=d.filter(f=>f.theme===colFilterTheme);
  d.sort((a,b)=>{
    if(nearMe&&userLat){const da=distKm(a),db=distKm(b);return da-db;}
    let va,vb;
    if(sortCol==="date"){va=a.date;vb=b.date}
    else if(sortCol==="name"){va=a.name.toLowerCase();vb=b.name.toLowerCase()}
    else if(sortCol==="location"){va=a.location.toLowerCase();vb=b.location.toLowerCase()}
    else{va=a.theme;vb=b.theme}
    if(va<vb)return sortAsc?-1:1;if(va>vb)return sortAsc?1:-1;return 0;
  });
  return d;
}

/* ── Render ── */
function render(){
  updateClearBtn();
  const data=getFiltered(),tbody=document.getElementById("festBody"),noRes=document.getElementById("noResults");
  document.getElementById("resultCount").textContent=data.length+" festival"+(data.length!==1?"s":"");
  if(!data.length){tbody.innerHTML="";noRes.style.display="block";renderDots();updateCard();return}
  noRes.style.display="none";
  tbody.innerHTML=data.map((f,i)=>{
    const d=pd(f.date);
    const isSel=selectedFest&&selectedFest.name===f.name;
    const past=isPast(f);
    const isFav=favorites.has(f.name);
    const linkHtml=f.url?`<a class="fest-link" href="${f.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Website</a>`:"";
    const trainIcon=amtrakCities.has(f.location)?`<span class="train-badge" data-city="${f.location}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="16" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/><path d="M8 19l-2 3"/><path d="M16 19l2 3"/></svg>Amtrak</span>`:"";
    const distHtml=nearMe&&userLat?`<span class="dist-badge">📍 ${fmtDist(distKm(f))}</span>`:"";
    const pastHtml=past?`<span class="past-label">PAST</span>`:"";
    return `<tr class="${isSel?"selected":""} ${past?"past-fest":""}" style="animation-delay:${i*.015}s" data-fname="${f.name.replace(/"/g,"&quot;")}">
      <td class="fest-date"><div class="month">${MN[d.getMonth()]}</div>${fdr(f)}</td>
      <td>
        <div class="fest-name">${f.name}</div>
        <span class="fest-loc-inline">${f.location} ${trainIcon}</span>
        <div class="fest-desc" id="desc-${i}">${f.desc||""}</div>
        <button class="expand-btn" onclick="toggleDesc(${i},event)" id="xbtn-${i}">More ▾</button>
        <div class="row-actions">
          <button class="fav-btn ${isFav?"active":""}" onclick="toggleFav('${f.name.replace(/'/g,"\'")}',event)">${isFav?"❤️":"🤍"} ${isFav?"Saved":"Save"}</button>
          <button class="cal-btn" onclick="addToCalendar(festivals.find(x=>x.name==='${f.name.replace(/'/g,"\'")}'),event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendar</button>
          ${linkHtml}${distHtml}${pastHtml}
        </div>
      </td>
      <td class="fest-location">${f.location} ${trainIcon}</td>
      <td><span class="theme-tag ${tc(f.theme)}">${f.theme}</span></td>
    </tr>`;
  }).join("");

  tbody.querySelectorAll("tr").forEach(tr=>{
    tr.addEventListener("click",function(){
      if(event.target.closest(".fav-btn,.cal-btn,.fest-link,.train-badge,.expand-btn"))return;
      const f=festivals.find(x=>x.name===this.dataset.fname);
      if(f)selectFestival(f);
    });
  });
  // Amtrak badge events
  tbody.querySelectorAll(".train-badge").forEach(badge=>{
    badge.addEventListener("click",e=>{e.stopPropagation();showAmtrakTT(badge.dataset.city,badge)});
    badge.addEventListener("mouseenter",e=>showAmtrakTT(badge.dataset.city,badge));
    badge.addEventListener("mouseleave",hideAmtrakTT);
  });
  renderDots();updateCard();
}

function toggleDesc(i,e){
  e.stopPropagation();
  const d=document.getElementById("desc-"+i),b=document.getElementById("xbtn-"+i);
  const exp=d.classList.toggle("expanded");
  b.textContent=exp?"Less ▴":"More ▾";
}

function selectFestival(f){
  selectedFest=f;render();
  if(window.innerWidth>=1001){
    const mb=document.getElementById("mapBody");
    mb.classList.add("open");mb.style.display="block";
    document.getElementById("mapChevron").textContent="▲";
  }
  const sel=document.querySelector("tr.selected");
  if(sel)sel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function updateCard(){
  const c=document.getElementById("selectedCard");
  if(selectedFest){
    const trainNote=amtrakCities.has(selectedFest.location)?" · 🚆 Amtrak from Raleigh":"";
    c.querySelector(".sc-name").textContent=selectedFest.name;
    c.querySelector(".sc-meta").innerHTML=fdr(selectedFest)+" · "+selectedFest.location+trainNote;
    c.querySelector(".sc-desc").textContent=selectedFest.desc||"";
    const isFav=favorites.has(selectedFest.name);
    const calBtn=`<button class="cal-btn" onclick="addToCalendar(selectedFest,event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Calendar</button>`;
    const favBtn=`<button class="fav-btn ${isFav?"active":""}" onclick="toggleFav(selectedFest.name,event)">${isFav?"❤️":"🤍"} ${isFav?"Saved":"Save"}</button>`;
    const linkBtn=selectedFest.url?`<a class="fest-link" href="${selectedFest.url}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> Website</a>`:"";
    c.querySelector(".sc-actions").innerHTML=favBtn+calBtn+linkBtn;
    c.classList.add("visible");
  }else c.classList.remove("visible");
}

/* ── Map Toggle (mobile) ── */
let mapOpen=false;
function toggleMap(){
  if(window.innerWidth>=1001)return;
  mapOpen=!mapOpen;
  const mb=document.getElementById("mapBody");
  mb.classList.toggle("open",mapOpen);
  mb.style.display=mapOpen?"block":"none";
  document.getElementById("mapChevron").textContent=mapOpen?"▲":"▼";
  if(mapOpen)setTimeout(renderDots,50);
}

/* ── Map Zoom ── */
let zoomScale=1,zoomTx=0,zoomTy=0;
const ZOOM_MIN=1,ZOOM_MAX=10,ZOOM_STEP=1.5;
function applyZoom(){
  const canvas=document.getElementById("mapCanvas");if(!canvas)return;
  const svg=document.getElementById("mapSvg");
  const vw=svg.clientWidth||420,vh=svg.clientHeight||320;
  const scW=SW*zoomScale,scH=SH*zoomScale;
  zoomTx=Math.max(Math.min(0,vw-scW),Math.min(0,zoomTx));
  zoomTy=Math.max(Math.min(0,vh-scH),Math.min(0,zoomTy));
  canvas.setAttribute("transform",`translate(${zoomTx},${zoomTy}) scale(${zoomScale})`);
  const s=zoomScale;
  const show=(id,thresh)=>{const el=document.getElementById(id);if(el)el.style.opacity=s>=thresh?Math.min(1,(s-thresh)/.5):"0"};
  show("cityL2",1.8);show("cityL3",3.5);show("cityL4",6);show("interstateLayer",2.5);
  const rl=document.getElementById("regionLabels");if(rl)rl.style.opacity=s>2.5?Math.max(0,1-(s-2.5)/.5):"1";
  const dotScale=1/zoomScale;
  document.querySelectorAll(".map-dot").forEach(d=>{
    const baseR=window.innerWidth<=600?7:5.5,selR=window.innerWidth<=600?11:9;
    const isSel=selectedFest&&d.dataset.name===selectedFest.name;
    d.setAttribute("r",(isSel?selR:baseR)*dotScale);
    d.setAttribute("stroke-width",(isSel?3:1.5)*dotScale);
  });
}
function zoomToward(svgX,svgY,newScale){
  newScale=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,newScale));
  zoomTx=svgX-(svgX-zoomTx)*(newScale/zoomScale);
  zoomTy=svgY-(svgY-zoomTy)*(newScale/zoomScale);
  zoomScale=newScale;applyZoom();
}

function legendFilter(theme){

  render();writeURL();
}

let lastTouchedDot=null;
function dotTouch(e){
  const t=e.target;if(!t)return;
  const f=festivals.find(x=>x.name===t.dataset.name);if(!f)return;
  if(lastTouchedDot===f.name){selectFestival(f);lastTouchedDot=null;return;}
  lastTouchedDot=f.name;
  showMapTooltip(f,t);
  setTimeout(()=>{document.getElementById("mapTooltip").classList.remove("visible")},2500);
}
function showMapTooltip(f,dot){
  const tt=document.getElementById("mapTooltip"),ct=document.getElementById("mapContainer"),sv=document.getElementById("mapSvg"),sr=sv.getBoundingClientRect();
  const cx=+dot.getAttribute("cx"),cy=+dot.getAttribute("cy");
  const scX=sr.width/SW,scY=sr.height/SH;
  const cw=ct.offsetWidth,ch=ct.offsetHeight;
  let tx=cx*scX+14,ty=cy*scY-10;
  if(tx+180>cw)tx=Math.max(5,cx*scX-190);
  tx=Math.max(5,tx);ty=Math.max(5,ty);
  if(ty+80>ch)ty=ch-85;
  tt.querySelector(".tt-name").textContent=f.name;
  tt.querySelector(".tt-date").textContent=fdr(f);
  tt.querySelector(".tt-loc").textContent=f.location;
  tt.style.left=tx+"px";tt.style.top=ty+"px";tt.classList.add("visible");
}
function dotHover(e){const f=festivals.find(x=>x.name===e.target.dataset.name);if(f)showMapTooltip(f,e.target)}
function dotLeave(){document.getElementById("mapTooltip").classList.remove("visible")}
function dotClick(e){const f=festivals.find(x=>x.name===e.target.dataset.name);if(f)selectFestival(f)}

/* ── Zoom Controls ── */
function initZoom(){
  const svg=document.getElementById("mapSvg");
  svg.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=svg.getBoundingClientRect(),scX=SW/r.width,scY=SH/r.height;
    zoomToward((e.clientX-r.left)*scX,(e.clientY-r.top)*scY,zoomScale*(e.deltaY<0?ZOOM_STEP:1/ZOOM_STEP));
  },{passive:false});
  let dragging=false,dragX=0,dragY=0;
  svg.addEventListener("mousedown",e=>{if(e.target.classList.contains("map-dot"))return;dragging=true;dragX=e.clientX;dragY=e.clientY;svg.style.cursor="grabbing"});
  window.addEventListener("mousemove",e=>{if(!dragging)return;const r=svg.getBoundingClientRect(),scX=SW/r.width,scY=SH/r.height;zoomTx+=(e.clientX-dragX)*scX;zoomTy+=(e.clientY-dragY)*scY;dragX=e.clientX;dragY=e.clientY;applyZoom()});
  window.addEventListener("mouseup",()=>{dragging=false;if(document.getElementById("mapSvg"))document.getElementById("mapSvg").style.cursor="grab"});
  let lastDist=null,lastMidX=0,lastMidY=0;
  svg.addEventListener("touchmove",e=>{
    if(e.touches.length!==2)return;e.preventDefault();
    const t1=e.touches[0],t2=e.touches[1];
    const dist=Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY);
    const midX=(t1.clientX+t2.clientX)/2,midY=(t1.clientY+t2.clientY)/2;
    if(lastDist!==null){const r=svg.getBoundingClientRect(),scX=SW/r.width,scY=SH/r.height;zoomToward((midX-r.left)*scX,(midY-r.top)*scY,zoomScale*(dist/lastDist));zoomTx+=(midX-lastMidX)*scX;zoomTy+=(midY-lastMidY)*scY;applyZoom()}
    lastDist=dist;lastMidX=midX;lastMidY=midY;
  },{passive:false});
  svg.addEventListener("touchend",()=>{lastDist=null});
  svg.addEventListener("dblclick",e=>{if(e.target.classList.contains("map-dot"))return;const r=svg.getBoundingClientRect(),scX=SW/r.width,scY=SH/r.height;zoomToward((e.clientX-r.left)*scX,(e.clientY-r.top)*scY,zoomScale*ZOOM_STEP)});
  document.getElementById("zoomIn").addEventListener("click",()=>zoomToward(SW/2,SH/2,zoomScale*ZOOM_STEP));
  document.getElementById("zoomOut").addEventListener("click",()=>zoomToward(SW/2,SH/2,zoomScale/ZOOM_STEP));
  document.getElementById("zoomReset").addEventListener("click",()=>{zoomScale=1;zoomTx=0;zoomTy=0;applyZoom()});
}

/* ── Amtrak Tooltip ── */
let amtrakTT=document.getElementById("amtrakTooltip");
function showAmtrakTT(city,el){
  const info=amtrakInfo[city];if(!info)return;
  const pills=info.routes.map((r,i)=>`<span class="at-route ${r}">${info.routeNames[i]}</span>`).join("");
  amtrakTT.innerHTML=`<div class="at-header"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8d5a2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="16" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/><path d="M8 19l-2 3"/><path d="M16 19l2 3"/></svg><span class="at-station">${info.station}</span></div><div class="at-time">🕐 ${info.time}</div><div class="at-routes">${pills}</div><div class="at-walk">${info.walk}</div><div class="at-note">${info.note}</div>`;
  const r=el.getBoundingClientRect(),ttW=280;
  let left=r.left,top=r.bottom+6;
  if(left+ttW>window.innerWidth-10)left=window.innerWidth-ttW-10;
  if(left<10)left=10;
  if(top+220>window.innerHeight)top=r.top-225;
  amtrakTT.style.left=left+"px";amtrakTT.style.top=top+"px";
  amtrakTT.classList.add("visible");
}
function hideAmtrakTT(){amtrakTT.classList.remove("visible")}
document.addEventListener("click",e=>{if(!e.target.closest(".train-badge"))hideAmtrakTT()});

/* ── Resizer ── */
(function(){
  const resizer=document.getElementById("panelResizer");
  const tp=document.querySelector(".table-panel");
  const mp=document.getElementById("mapPanel");
  if(!resizer||!tp||!mp)return;
  let active=false,startX=0,startTW=0,startMW=0;
  resizer.addEventListener("mousedown",e=>{active=true;startX=e.clientX;startTW=tp.getBoundingClientRect().width;startMW=mp.getBoundingClientRect().width;resizer.classList.add("dragging");document.body.style.cursor="col-resize";document.body.style.userSelect="none";e.preventDefault()});
  window.addEventListener("mousemove",e=>{if(!active)return;const dx=e.clientX-startX,total=startTW+startMW,nTW=Math.max(280,Math.min(total-200,startTW+dx)),nMW=total-nTW;tp.style.flex=`0 0 ${nTW}px`;tp.style.width=`${nTW}px`;mp.style.flex=`0 0 ${nMW}px`;mp.style.width=`${nMW}px`;clearTimeout(window._rr);window._rr=setTimeout(renderDots,80)});
  window.addEventListener("mouseup",()=>{active=false;resizer.classList.remove("dragging");document.body.style.cursor="";document.body.style.userSelect=""});
})();

document.getElementById("colFilterTheme").addEventListener("change",e=>{colFilterTheme=e.target.value;render()});
document.getElementById("mapContainer").addEventListener("click",e=>{
  if(!e.target.classList.contains("map-dot")){document.getElementById("mapTooltip").classList.remove("visible");lastTouchedDot=null}
});
window.addEventListener("orientationchange",()=>setTimeout(renderDots,100));
window.addEventListener("resize",()=>{clearTimeout(window._rr);window._rr=setTimeout(renderDots,150)});

/* ── Auto-scroll to next upcoming ── */
function scrollToToday(){
  const data=getFiltered();
  const next=data.find(f=>!isPast(f));
  if(!next)return;
  const rows=document.querySelectorAll("#festBody tr");
  rows.forEach(tr=>{
    if(tr.dataset.fname===next.name){
      tr.classList.add("today-row");
      setTimeout(()=>tr.scrollIntoView({behavior:"smooth",block:"center"}),350);
    }
  });
}

/* ── Boot ── */
readURL();
hidePast=true;document.getElementById("hidePastBtn").classList.add("active");
updateCounts();
initMap();
render();
renderFavsPanel();
scrollToToday();
